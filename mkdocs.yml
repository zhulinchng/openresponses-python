site_name: OpenResponses Python SDK
site_description: Typed Python client for the OpenResponses 2026-04-24 protocol
site_author: OpenResponses Python contributors
site_url: https://zhulinchng.github.io/openresponses-python/
repo_url: https://github.com/zhulinchng/openresponses-python
repo_name: zhulinchng/openresponses-python
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
  - Core concepts:
      - Protocol models: protocol.md
      - Provider compatibility: compatibility.md
      - OpenAI and MLflow: compatibility.md
  - Transports:
      - Server-sent events: streaming.md
      - WebSockets: websocket.md
  - API reference: api.md
  - Project:
      - Release process: https://github.com/zhulinchng/openresponses-python/blob/main/RELEASING.md
      - Source code: https://github.com/zhulinchng/openresponses-python
