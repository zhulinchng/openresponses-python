name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and release tools
        run: python -m pip install --upgrade build twine

      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Run type and style checks
        run: |
          python -m mypy src/openresponses
          python -m ruff check src/openresponses tests examples scripts
          python -m ruff format --check src/openresponses tests examples scripts
          python scripts/generate_models.py --check
          python -m mkdocs build --strict

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel --outdir dist/

      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              required = {
                  "openresponses/VERSION",
                  "openresponses/openapi/2026-04-24.json",
                  "openresponses/py.typed",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"wheel missing package data: {sorted(missing)}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openresponses-py
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
